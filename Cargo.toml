[package]
name = "eldenring-backuptool"
version = "1.2.0"
edition = "2024"
description = "Automatic versioned backups of vanilla Elden Ring saves (Elden Ring Save Guard)"
license = "MIT"

[workspace]
resolver = "3"

[lib]
name = "save_guard"
path = "src/lib.rs"

[[bin]]
name = "eldenring-backuptool"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# GUI + dialogs live behind this feature so `cargo test --lib --no-default-features`
# builds the portable core on Linux without pulling eframe/egui/rfd (and X11).
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }
chrono = { version = "=0.4.45", features = ["serde"] }
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
directories = "=6.0.0"
# The self-updater in `update.rs`, shared byte-for-byte with the other apps.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
# reqwest's `rustls-no-provider` feature deliberately selects no crypto backend;
# this direct dependency exposes ring, which `update::Client` installs once.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tar = { version = "=0.4.46", default-features = false }
thiserror = "=2.0.21"
# GUI + dialogs: optional, enabled by the `gui` feature (see [features]).
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11"], optional = true }
egui = { version = "=0.37.0", features = ["monochrome_emoji_fonts"], optional = true }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6", "xdg-portal"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
